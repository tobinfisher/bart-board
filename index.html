<title>Bay Fair ⇄ Embarcadero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@600&display=swap">
<style>
/* Layout: two stacked departure boards, one per direction, read like platform signage */
:root{
  --bg:#eef2f4; --panel:#ffffff; --fg:#0d1a24; --muted:#5c6b76; --rule:#d5dde2;
  --accent:#0099d8; --late:#c2410c;
  --display:"Overpass",system-ui,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b141b; --panel:#13212c; --fg:#e8eef2; --muted:#8a9aa6; --rule:#22323e;
  --accent:#3bb4ea; --late:#fb923c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.3 var(--display);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
/* Sized to fit one iPhone screen: at most 4 trains per board, compact rows */
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}
section{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
h2{margin:0;padding:10px 14px 8px;border-bottom:1px solid var(--rule);font-size:1.05rem;font-weight:800;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--rule)}
li:first-child{border-top:0}
.chip{width:8px;height:30px;border-radius:3px}
.dest{min-width:0}
.dest b{display:block;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest span{font-size:.75rem;color:var(--muted)}
.dest .late{color:var(--late)}
.min{font:600 1.45rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;line-height:1;display:flex;align-items:baseline;gap:3px}
.min small{font:600 .65rem var(--display);color:var(--muted);letter-spacing:.06em}
.empty{padding:12px 14px;color:var(--muted);font-size:.9rem}
.err{color:var(--late)}
.note{padding:6px 14px;font-size:.75rem;letter-spacing:.02em}
.status{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:center;gap:10px;align-items:center}
button{font:600 .75rem var(--display);color:var(--accent);background:none;border:1px solid var(--rule);
  border-radius:999px;padding:3px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <section aria-labelledby="t2">
    <h2 id="t2">From Embarcadero <span>15–40 min</span></h2>
    <ol id="embr"><li class="empty">Loading departures…</li></ol>
  </section>

  <section aria-labelledby="t1">
    <h2 id="t1">From Bay Fair <span>4–30 min</span></h2>
    <ol id="bayf"><li class="empty">Loading departures…</li></ol>
  </section>

  <div class="status"><span id="updated">Loading…</span><button id="refresh" type="button">Refresh</button></div>
</main>

<script>
const KEY = "MW9S-E7SL-26DU-VV8V"; // BART's public API key
// Destinations whose trains pass Embarcadero (from Bay Fair) or Bay Fair (from Embarcadero)
const TO_SF = new Set(["EMBR","MONT","POWL","CIVC","16TH","24TH","GLEN","BALB","DALY","COLM","SSAN","SBRN","SFIA","MLBR"]);
const TO_BAYF = new Set(["BAYF","SHAY","UCTY","FRMT","WARM","MLPT","BERY","CAST","WDUB","DUBL"]);

// BART moved its legacy API to api2.bart.gov; keep the old host as a fallback
const HOSTS = ["https://api2.bart.gov", "https://api.bart.gov"];
async function etd(orig){
  let last;
  for(const h of HOSTS){
    try{
      const r = await fetch(`${h}/api/etd.aspx?cmd=etd&orig=${orig}&key=${KEY}&json=y`, {cache:"no-store"});
      if(!r.ok) throw new Error(`BART returned ${r.status}`);
      const j = await r.json();
      return j?.root?.station?.[0]?.etd || [];
    }catch(e){ last = e; }
  }
  throw last;
}

// Only trains you can actually catch: [min, max] minutes away
const WINDOW = { BAYF:[4,30], EMBR:[15,40] };
const MAX_ROWS = 4;

function trains(list, allowed, [lo, hi]){
  const out = [];
  for(const d of list){
    if(!allowed.has(d.abbreviation)) continue;
    for(const e of d.estimate){
      const m = e.minutes === "Leaving" ? 0 : parseInt(e.minutes,10);
      if(Number.isNaN(m) || m < lo) continue; // too soon to catch
      out.push({dest:d.destination, min:m, cars:e.length, color:e.hexcolor, platform:e.platform, delay:+e.delay||0});
    }
  }
  out.sort((a,b)=>a.min-b.min);
  const inWindow = out.filter(t=>t.min<=hi);
  // Nothing in the window: fall back to the next two catchable trains after it
  return inWindow.length ? {rows:inWindow.slice(0, MAX_ROWS), fallback:false}
                         : {rows:out.slice(0, 2), fallback:true};
}

function render(el, {rows, fallback}, [lo, hi]){
  el.replaceChildren();
  if(!rows.length){
    const li=document.createElement("li"); li.className="empty";
    li.textContent=`No trains ${lo}+ minutes out.`; el.append(li); return;
  }
  if(fallback){
    const li=document.createElement("li"); li.className="empty note";
    li.textContent=`Nothing ${lo}–${hi} min out. Next trains:`; el.append(li);
  }
  const now = new Date();
  for(const t of rows){
    const li=document.createElement("li");
    const chip=document.createElement("div"); chip.className="chip"; chip.style.background=t.color||"var(--muted)";
    const dest=document.createElement("div"); dest.className="dest";
    const b=document.createElement("b"); b.textContent=t.dest;
    const s=document.createElement("span");
    const at=new Date(now.getTime()+t.min*60000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    s.textContent=`${t.cars}-car · Platform ${t.platform} · ${at}`;
    dest.append(b,s);
    if(t.delay>=60){const d=document.createElement("span"); d.className="late"; d.textContent=` · ${Math.round(t.delay/60)} min late`; s.append(d);}
    const m=document.createElement("div"); m.className="min"+(t.min===0?" now":"");
    if(t.min===0){m.textContent="Now";}
    else{m.textContent=t.min; const sm=document.createElement("small"); sm.textContent="MIN"; m.append(sm);}
    li.append(chip,dest,m); el.append(li);
  }
}

function fail(el, err){
  el.innerHTML=""; const li=document.createElement("li"); li.className="empty err";
  li.textContent=`Couldn't load arrivals (${err.message}). Check your connection and tap Refresh.`; el.append(li);
}

const upd=document.getElementById("updated");
async function load(){
  upd.textContent="Updating…";
  const [a,b] = await Promise.allSettled([etd("BAYF"), etd("EMBR")]);
  a.status==="fulfilled" ? render(document.getElementById("bayf"), trains(a.value, TO_SF, WINDOW.BAYF), WINDOW.BAYF) : fail(document.getElementById("bayf"), a.reason);
  b.status==="fulfilled" ? render(document.getElementById("embr"), trains(b.value, TO_BAYF, WINDOW.EMBR), WINDOW.EMBR) : fail(document.getElementById("embr"), b.reason);
  upd.textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
}
document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });
load();
setInterval(()=>{ if(!document.hidden) load(); }, 30000);
</script>
</body>
</html>
